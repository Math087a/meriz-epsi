<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merise - EPSI Edition</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta
      name="description"
      content="Merise EPSI Edition : modélisation de bases de données par la méthode Merise. Dictionnaire, MCD, héritage formel, puis génération du MLD, du MPD et du SQL (T-SQL, MySQL, PostgreSQL)."
    />
    <meta name="theme-color" content="#161b18" />
    <meta property="og:title" content="Merise - EPSI Edition" />
    <meta
      property="og:description"
      content="Modélisation Merise moderne pour l'EPSI : MCD, héritage, MLD dynamique et génération T-SQL."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <script>
      // Thème appliqué avant le premier rendu : aucun flash de couleur.
      // Même logique que src/lib/theme.ts (Système, Clair ou Sombre).
      ;(function () {
        var preference = 'system'
        try {
          var stored = localStorage.getItem('merise-theme') || localStorage.getItem('meriz-theme')
          if (stored === 'light' || stored === 'dark') preference = stored
        } catch (e) {}
        var dark =
          preference === 'dark' ||
          (preference === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161b18')
        else document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f4f6f4')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
