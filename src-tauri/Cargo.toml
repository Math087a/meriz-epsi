[package]
name = "merise-epsi"
version = "1.7.3"
description = "Merise EPSI Edition"
authors = ["Math087a"]
license = "AGPL-3.0-only"
repository = "https://github.com/Math087a/meriz-epsi"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-process = "2"
